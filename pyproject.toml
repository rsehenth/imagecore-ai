[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imagecore-ai"
version = "0.1.0"
description = "ImageCore AI - geracao e edicao local de imagens (Thumbnail Creator + Image Creator)"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.28",
    "pydantic>=2.9",
    "PyYAML>=6.0.2",
    "Pillow>=10.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
